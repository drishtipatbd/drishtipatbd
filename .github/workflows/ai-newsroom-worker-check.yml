name: AI newsroom Worker syntax check

on:
  push:
    branches:
      - ai-newsroom-integration
    paths:
      - "workers/ai-newsroom/**"
      - ".github/workflows/ai-newsroom-worker-check.yml"
  pull_request:
    branches:
      - main
    paths:
      - "workers/ai-newsroom/**"
      - ".github/workflows/ai-newsroom-worker-check.yml"

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Worker JavaScript syntax
        run: node --check workers/ai-newsroom/src/index.js
