name: AI newsroom Worker syntax check

on:
  push:
    branches:
      - ai-newsroom-integration
    paths:
      - "workers/ai-newsroom/**"
      - ".github/workflows/ai-newsroom-worker-check.yml"
  pull_request:
    branches:
      - main
    paths:
      - "workers/ai-newsroom/**"
      - ".github/workflows/ai-newsroom-worker-check.yml"

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Worker JavaScript syntax
        run: node --check workers/ai-newsroom/src/index.js
      - name: Validate candidate source registry JSON and safe defaults
        run: |
          node -e 'const r=require("./workers/ai-newsroom/source-registry.candidates.json"); if (!Array.isArray(r.sources) || r.sources.length < 1) process.exit(1); if (r.sources.some(s => s.enabled !== false || s.status !== "review_required")) process.exit(1); console.log("Validated", r.sources.length, "disabled review candidates");'
