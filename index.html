<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#006a4e">
<meta name="description" content="দৃষ্টিপাতBD — শিগগিরই আসছে">
<title>দৃষ্টিপাতBD — শিগগিরই আসছে</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root{color-scheme:light;--green:#006a4e;--red:#f42a41;--ink:#17231f}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f7faf8;color:var(--ink);font-family:"Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif}
main{width:min(760px,100%);text-align:center;padding:clamp(28px,7vw,64px) 20px}
.mark{width:82px;height:82px;border-radius:22px;background:var(--green);margin:0 auto 24px;display:grid;place-items:center;position:relative;overflow:hidden}
.mark:before{content:"";width:35px;height:35px;background:var(--red);border-radius:50%;position:absolute;left:24px;top:23px}
.mark:after{content:"";position:absolute;left:0;right:0;bottom:12px;height:7px;background:#fff;transform:rotate(-17deg)}
.brand{font-size:clamp(30px,7vw,52px);font-weight:900;letter-spacing:-1px;margin:0;color:var(--green)}
.brand span{color:var(--red)}.rule{height:4px;width:100px;margin:22px auto;background:linear-gradient(90deg,var(--green) 0 50%,var(--red) 50%)}
h1{font-size:clamp(25px,5vw,38px);margin:18px 0 12px;font-weight:800}
p{font-size:clamp(15px,3vw,18px);line-height:1.9;color:#53645d;margin:0}
footer{margin-top:46px;font-size:12px;color:#829088}
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true"></div>
  <p class="brand">দৃষ্টিপাত<span>BD</span></p>
  <div class="rule"></div>
  <h1>দৃষ্টিপাত শিগগিরই আসছে</h1>
  <p>সত্যের পথে, মানুষের পাশে।</p>
  <footer>© <span id="year"></span> দৃষ্টিপাতBD</footer>
</main>
<script>document.getElementById('year').textContent=new Date().getFullYear();</script>
</body>
</html>
