<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>বিজ্ঞাপন অবস্থান | দৃষ্টিপাতBD</title>
<link rel="stylesheet" href="style.css?v=20261105-simple-ads">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<style>
.adscan-wrap{max-width:1050px;margin:28px auto;padding:20px}.adscan-panel{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:20px;margin:16px 0}.adscan-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.adscan-card{border:1px solid #e5e7eb;border-radius:8px;padding:14px;background:#fff}.adscan-card p{margin:6px 0}.adscan-status{font-weight:700}.adscan-note{font-size:12px;color:#697078;margin-top:14px}
</style>
</head>
<body class="admin-body">
<header class="admin-top"><a href="admin.html" class="admin-brand">দৃষ্টিপাত<span>BD</span> <small>বিজ্ঞাপন অবস্থান</small></a><a class="btn btn-light" href="index.html">Preview সাইট</a></header>
<main class="adscan-wrap">
<section id="loginPanel" class="login-card"><h1>অ্যাডমিন লগইন</h1><p class="muted">বিজ্ঞাপন অবস্থান দেখতে Admin অ্যাকাউন্ট দিয়ে প্রবেশ করুন।</p><form id="loginForm"><label>ইমেইল<input id="email" type="email" required autocomplete="username"></label><label>পাসওয়ার্ড<input id="password" type="password" required autocomplete="current-password"></label><button class="btn btn-red" type="submit">লগইন</button><p id="loginMessage" class="form-message"></p></form></section>
<section id="scanPanel" class="adscan-panel hidden"><h1>বর্তমানে বিজ্ঞাপন কোথায় দেখাচ্ছে</h1><p class="muted">এটি শুধু পর্যবেক্ষণ তালিকা। এখান থেকে বিজ্ঞাপন সেটিংস পরিবর্তন করা যাবে না। বিজ্ঞাপন যোগ বা সম্পাদনা হবে মূল অ্যাডমিন প্যানেলে।</p><div id="inventoryStatus" class="adscan-grid"><p>তথ্য লোড হচ্ছে…</p></div><p id="scanNote" class="adscan-note"></p><button id="scanAgain" class="btn btn-light" type="button">আবার পরীক্ষা করুন</button> <button id="logoutBtn" class="btn btn-light" type="button">লগআউট</button><span id="status" class="form-message"></span></section>
</main>
<script src="ad-management.js"></script>
</body></html>
